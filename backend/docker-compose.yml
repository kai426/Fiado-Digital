services:
  postgres:
    image: postgres:16-alpine
    container_name: fiado-digital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fiado_digital
      POSTGRES_USER: fiado
      POSTGRES_PASSWORD: fiado
    ports:
      - "5432:5432"
    volumes:
      - fiado_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiado -d fiado_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fiado_postgres_data:
